name: Publish Combat Race Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combat-race-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled preview artifact
        run: |
          curl --fail --location 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e5ac-81f5-b9cd-3c23a584d8b8/raw?se=2026-09-21T05%3A52%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=4d1e7f38-c03f-5031-939e-069898ddb5a3&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T17%3A20%3A09Z&ske=2026-09-21T17%3A20%3A09Z&sks=b&skv=2026-02-06&sig=svjlZ23VnfIQMFvFLu8qffSamkVZTR8bVy2uR1T4zik%3D' --output /tmp/redline-preview.zip
          rm -rf /tmp/redline-site
          mkdir -p /tmp/redline-site
          unzip -q /tmp/redline-preview.zip -d /tmp/redline-site
          find /tmp/redline-site -type f -name '*.map' -delete
          touch /tmp/redline-site/.nojekyll
          test -f /tmp/redline-site/index.html

      - name: Publish build-only gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -a /tmp/redline-site/. .
          git add -A
          git commit -m "Publish integrated POC preview"
          git push --force origin gh-pages
